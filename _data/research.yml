# CAVEAT: citation links point at /Publications/#pub-N anchors, which are
# numbered newest-first from publist.yml — adding a paper at the top of
# publist.yml shifts every number, so bump the citations here to match.
- title: Individual responses to meals
  image: 1.jpg
  width: 70%
  alt: >-
    Physiological factors (gastric emptying, glucoregulatory hormones, amylase)
    and lifestyle factors (diet, exercise, sleep) shaping glucose levels
    measured by continuous glucose monitoring.
  text: |
    <u>What factors affect glycemic responses to meals?</u> Glycemic responses to identical meals vary across individuals and associate with metabolic subtypes (e.g., insulin resistance and beta-cell dysfunction) \[[7](/Publications/#pub-7), [8](/Publications/#pub-8), [9](/Publications/#pub-9)\]. We aim to dissect the contributing factors — metabolic health, diet, behavior, genetics, and the microbiome — using both controlled meal challenges and real-life meals, to identify targets for reducing risk of metabolic diseases such as diabetes. We do both statistical modeling and new CGM cohort collection.

- title: Dynamic regulation of metabolism
  image: 2-dynamics-and-pathways.png
  width: 100%
  alt: >-
    Glucose, G1P, alanine, and ethanol time courses and the highlighted central
    energy metabolism network in N. crassa, beside microbial pathways affecting
    metabolic traits directly and through metabolite mediation. Time courses and
    network adapted from Wu et al., PLOS ONE (2022), Figures 2B and 5B.
  text: |
    <u>How do we understand dynamics in metabolic process?</u> Human metabolisms respond dynamically to everyday perturbations (e.g., meals) on short timescales, providing natural experiments for understanding biological regulation. We develop computational methods that integrate time-series omics data to uncover how glucose dynamics shape — and are shaped by — broader metabolic processes, toward mechanistic understanding of disease and its complications.

- title: AI for precision nutrition
  image: 3-ai-nutrition.png
  width: 100%
  alt: >-
    Conceptual schematic linking glucose dynamics and food logs to an AI model,
    with bidirectional cohort interaction and predictions of muscle insulin
    resistance, beta-cell function, incretin effect, and liver insulin resistance.
  text: |
    <u>How can AI help data collection and analysis in nutrition science?</u> Advances in AI enable both deeper physiological insight (via foundation models) and scalable data collection and analysis (via agentic frameworks). We build models that infer metabolic health states such as insulin resistance and automate the capture and interpretation of real-life dietary records.
